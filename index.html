<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prayo">
<script>try{if(localStorage.getItem('prayo:theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Prayo – Prayer Times</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f6f3ec;--card:rgba(255,255,255,.72);--solid:#fff;--text:#14231e;--muted:#6a7b74;--accent:#0d9488;--accent2:#d4a017;--accent-bg:rgba(13,148,136,.12);--line:rgba(20,35,30,.09);--shadow:0 10px 40px rgba(20,60,50,.12);--blob1:#99f6e4;--blob2:#fde68a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1315;--card:rgba(24,38,41,.7);--solid:#182629;--text:#eaf3f0;--muted:#8fa49d;--accent:#2dd4bf;--accent2:#fbbf24;--accent-bg:rgba(45,212,191,.14);--line:rgba(255,255,255,.08);--shadow:0 10px 40px rgba(0,0,0,.4);--blob1:#0f766e;--blob2:#78350f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;position:relative;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none}
.b1{width:340px;height:340px;background:var(--blob1);top:-100px;left:-100px}
.b2{width:300px;height:300px;background:var(--blob2);bottom:-80px;right:-80px}
main{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0d9488 0%,#10b981 45%,#d4a017 100%);display:grid;place-items:center;box-shadow:0 6px 16px rgba(13,148,136,.35)}
.word{font-family:"Grand Hotel",cursive,Georgia,serif;font-size:34px;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px)}
.head-actions{display:flex;align-items:center;gap:8px}.install-btn{display:none;align-items:center;gap:7px;height:40px;padding:0 13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),#10b981);color:#04201c;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}.install-btn.visible{display:flex}
.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search{padding:14px;margin-bottom:16px;position:relative;z-index:4}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;padding:12px 14px;font:500 16px Inter,system-ui,sans-serif;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
select{margin-top:8px}
.btns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.btn{padding:13px 16px;border:0;border-radius:12px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,var(--accent),#10b981);color:#04201c}
.ghost{background:var(--accent-bg);color:var(--accent)}
.hero{padding:22px 18px;text-align:center;margin-bottom:0}
.loc{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.date{font-size:12.5px;color:var(--muted);margin-top:4px}
.ringwrap{position:relative;width:min(260px,72vw);height:min(260px,72vw);margin:18px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{stroke:var(--line);fill:none;stroke-width:10}
.prog{fill:none;stroke:url(#g);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.center small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.center .nm{font-size:30px;font-weight:700;margin:2px 0}
.center .ar{font-size:18px;color:var(--accent);margin-bottom:6px}
.center .cd{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.list{padding:8px}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:15px;transition:background .3s}
.row .dot{width:34px;height:34px;border-radius:11px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;flex:none}
.row .n{flex:1;font-weight:600;font-size:16px}
.row .n span{display:block;font-size:12px;color:var(--muted);font-weight:500}
.row .t{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.row.past{opacity:.5}
.row.on{background:linear-gradient(135deg,var(--accent),#10b981);color:#04201c}
.row.on .dot{background:rgba(255,255,255,.35);color:#04201c}
.row.on .n span{color:#04302a}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 4px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--solid);color:var(--text);border:1px solid var(--line);padding:12px 16px;border-radius:14px;box-shadow:var(--shadow);font-size:14px;opacity:0;transition:all .3s;z-index:5;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sk{height:300px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.place-results{position:absolute;top:calc(100% - 8px);left:14px;right:14px;max-height:280px;overflow:auto;padding:6px;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:5}
.place-results[hidden]{display:none}
.place-option{width:100%;padding:11px 12px;border:0;border-radius:10px;background:transparent;color:var(--text);text-align:left;font:500 14px Inter,system-ui,sans-serif;cursor:pointer}
.place-option:hover,.place-option:focus-visible{background:var(--accent-bg)}
.place-option small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{display:contents}
#out{display:flex;flex-direction:column;gap:16px}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.note{order:20}
.card{padding:18px}
.card h3{margin:0 0 12px;font-size:15px;letter-spacing:.02em}
.card .btn{width:100%}
.th{display:flex;justify-content:space-between;align-items:baseline}.th span{color:var(--accent);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--solid);color:var(--text);font:600 14px Inter,system-ui,sans-serif;cursor:pointer;transition:all .2s}
.chip.on{background:linear-gradient(135deg,var(--accent),#10b981);color:#04201c;border-color:transparent}
.qt{font-size:13.5px;color:var(--muted);margin:0;line-height:1.5}.qt b{color:var(--text)}
.compass{width:200px;margin:0 auto 10px}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1;padding:11px;font-size:14px}.btn.on{background:var(--accent);color:#04201c}
.dar{font-size:25px;line-height:2;text-align:center;color:var(--accent);margin:0 0 8px}
.tl{text-align:center;font-style:italic;font-weight:600;font-size:15px;line-height:1.6;margin:0 0 8px}
.ev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}.ev:last-of-type{border-bottom:0}.ev small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:2px}.ev b{color:var(--accent);white-space:nowrap}.compass svg{width:100%;display:block}
.ct{fill:var(--muted);font:600 12px Inter,sans-serif}
#dial{transition:transform .2s linear}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{padding:14px;border-radius:14px;background:var(--accent-bg);text-align:center}
.tile small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.tile b{font-size:19px;font-variant-numeric:tabular-nums}
.ta{text-align:center;font-size:30px;color:var(--accent);margin:4px 0 12px}
.tap{display:flex;flex-direction:column;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;margin:0 auto 14px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--accent),#10b981);color:#04201c;box-shadow:0 10px 26px rgba(13,148,136,.35);transition:transform .1s;user-select:none;-webkit-tap-highlight-color:transparent}
.tap:active{transform:scale(.94)}.tap b{font-size:46px;line-height:1}.tap small{font-size:12px;font-weight:600}
.tgt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}.tgt label{font-size:13px;color:var(--muted);font-weight:600}.tgt input{width:68px;padding:9px 6px;text-align:center}.tgt .chip{padding:8px 12px}
.counter-actions{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}.counter-actions .tap{margin:0}.undo{width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--solid);color:var(--muted);display:grid;place-items:center;cursor:pointer}.undo:disabled{opacity:.4;cursor:default}.undo:not(:disabled):active{transform:scale(.94)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s}
.modal-backdrop{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);max-height:85vh;overflow:auto;padding:18px}.modal h2{margin:0 0 14px;font-size:18px}.setting{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting label{font-size:14px;font-weight:600}.setting small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;margin-top:2px}.setting select,.setting input[type="number"]{width:150px;margin:0}.setting input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent)}.setting .btn{width:150px;padding:10px;font-size:13px}
@media (hover:hover){.btn:hover{filter:brightness(1.07)}.iconbtn:hover{border-color:var(--accent)}.row:not(.on):hover{background:var(--accent-bg)}}
@media (max-width:899px){main{max-width:520px}}
@media (max-width:380px){.fields{grid-template-columns:1fr}.word{font-size:30px}.hero{padding:18px 12px}}
@media (min-width:900px){
main{padding:32px 32px 64px}
header{margin-bottom:28px}
.search{display:flex;gap:10px;align-items:center;padding:12px}
.search .fields{flex:1}
.search .btns{margin-top:0;grid-template-columns:auto auto}
#out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
#out .note,#out .sk{grid-column:1/-1}
#out .hero{margin-bottom:0;padding:36px 24px;position:sticky;top:16px}
.ringwrap{width:290px;height:290px}
.row{padding:17px 16px}
.col{display:flex;flex-direction:column;gap:16px}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main>
  <header>
    <div class="brand">
      <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3v3M15.5 4.5h3" /></svg></div>
      <div class="word">Prayo</div>
    </div>
    <div class="head-actions"><button class="install-btn" id="install" type="button" onclick="installApp()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg>Install</button><button class="iconbtn" aria-label="Open settings" onclick="openSettings()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-2.6V20a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L7.6 17l.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.6-1H6.2v-2.6h.2A1.7 1.7 0 0 0 8 10.4a1.7 1.7 0 0 0-.3-1.9L7.6 8.4 9.4 6l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 12.4 5v-.2H15V5a1.7 1.7 0 0 0 1 1.4 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7.8l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2V14H21a1.7 1.7 0 0 0-1.6 1z"/></svg></button><button class="iconbtn" id="theme" aria-label="Toggle theme" onclick="toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button></div>
  </header>

  <section class="glass search">
    <div class="fields">
      <input id="city" placeholder="City" value="Kochi" autocomplete="off">
      <input id="country" placeholder="Country" value="India" autocomplete="off">
    </div>
    <div class="btns">
      <button class="btn primary" onclick="byCity()">Search city</button>
      <button class="btn ghost" onclick="byGeo()" aria-label="Use my location"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>Locate</button>
    </div>
    <div id="places" class="place-results" role="listbox" aria-label="Matching cities" hidden></div>
  </section>

  <div id="out"><div class="glass sk">Loading…</div></div>
</main>
<div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this)closeSettings()">
    <section class="modal glass" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>
      <div class="setting"><label for="calcMethod">Calculation method<small>Used for newly loaded times</small></label><select id="calcMethod"><option value="1">University of Islamic Sciences</option><option value="2">ISNA</option><option value="3">MWL</option><option value="4">Umm al-Qura</option><option value="5">Egyptian</option><option value="12">Gulf Region</option><option value="13">Turkey</option><option value="14">Russia</option><option value="16">Dubai</option></select></div>
      <div class="setting"><label for="asrMethod">Asr method</label><select id="asrMethod"><option value="0">Shafi / Standard</option><option value="1">Hanafi</option></select></div>
      <div class="setting"><label for="reminderOffset">Reminder before prayer</label><select id="reminderOffset"><option value="0">At prayer time</option><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div>
      <div class="setting"><label for="adhanEnabled">Reminder sound<small>Play a built-in chime when Prayo is open</small></label><input id="adhanEnabled" type="checkbox"></div>
      <div class="setting"><label for="testSound">Test reminder sound<small>Notification sound is controlled by your device</small></label><button class="btn ghost" id="testSound" type="button" onclick="chime()">Play sound</button></div>
      <p class="qt">Allow notifications in your browser and device settings to receive system alerts. Prayer reminders run while Prayo is open.</p>
      <div class="setting"><label for="manualOffset">Manual prayer adjustment<small>Minutes applied to every prayer</small></label><input id="manualOffset" type="number" min="-60" max="60" value="0"></div>
      <div class="setting"><label for="hijriOffset">Hijri day adjustment</label><input id="hijriOffset" type="number" min="-2" max="2" value="0"></div>
      <button class="btn primary" style="margin-top:14px" onclick="saveSettings()">Save settings</button>
    </section>
  </div>

<script>
const ORDER=["Fajr","Sunrise","Dhuhr","Asr","Maghrib","Isha"];
const AR={Fajr:"الفجر",Sunrise:"الشروق",Dhuhr:"الظهر",Asr:"العصر",Maghrib:"المغرب",Isha:"العشاء"};
const ICON={
Fajr:'<path d="M17 18a5 5 0 0 0-10 0M12 3v4M4.2 10.2l1.4 1.4M19.8 10.2l-1.4 1.4M2 18h20"/>',
Sunrise:'<path d="M17 18a5 5 0 0 0-10 0M12 9V2M8 5l4-3 4 3M2 22h20"/>',
Dhuhr:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
Asr:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',
Maghrib:'<path d="M17 18a5 5 0 0 0-10 0M12 9v-6M8 6l4 3 4-3M2 22h20"/>',
Isha:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'};
const C=2*Math.PI*96;
let st=null,timer=null;
const $=id=>document.getElementById(id);
let selectedPlace=null,placeRequest=0,placeTimer=null;
const DU=[['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.','Qur’an 2:201'],['حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ','Allah is sufficient for us, and He is the best disposer of affairs.','Qur’an 3:173'],['رَبِّ زِدْنِي عِلْمًا','My Lord, increase me in knowledge.','Qur’an 20:114'],['رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي','My Lord, expand my chest and ease my task for me.','Qur’an 20:25–26'],['لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','There is no power and no strength except with Allah.','Bukhari and Muslim'],['سُبْحَانَ اللَّهِ وَبِحَمْدِهِ سُبْحَانَ اللَّهِ الْعَظِيمِ','Glory be to Allah and praise Him; glory be to Allah the Magnificent.','Bukhari and Muslim'],['اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ','O Allah, help me to remember You, to thank You, and to worship You well.','Abu Dawud'],['رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا','Our Lord, do not hold us accountable if we forget or make a mistake.','Qur’an 2:286']];
let duI=Math.floor((new Date()-new Date(new Date().getFullYear(),0,0))/864e5)%DU.length;
const TR=['Rabbana ātinā fī d-dunya hasanatan wa fī l-ākhirati hasanatan wa qinā ‘adhāba n-nār','Hasbunāllāhu wa ni‘ma l-wakīl','Rabbi zidnī ‘ilmā','Rabbi shrah lī sadrī wa yassir lī amrī','Lā hawla wa lā quwwata illā billāh','Subhāna llāhi wa bihamdihī, Subhāna llāhi l-‘Azīm','Allāhumma a‘innī ‘alā dhikrika wa shukrika wa husni ‘ibādatik','Rabbanā lā tu’ākhidhnā in nasīnā aw akhta’nā'];

function render(times,label,sub,demo,meta){

  const manual=prefs().manual||0;
  ORDER.forEach(p=>{const [h,m]=clean(times[p]).split(':').map(Number);const adjusted=(h*60+m+manual+1440)%1440;st.times[p]=String(Math.floor(adjusted/60)).padStart(2,'0')+':'+String(adjusted%60).padStart(2,'0')});

  <div class="ringwrap"><svg viewBox="0 0 224 224"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs><circle class="track" cx="112" cy="112" r="96"/><circle class="prog" id="prog" cx="112" cy="112" r="96" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>

  ORDER.forEach(p=>{h+=`<div class="row" id="r-${p}"><div class="dot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[p]}</svg></div><div class="n">${p==="Dhuhr"&&new Date().getDay()===5?"Jumu’ah":p}<span>${AR[p]}</span></div><div class="t">${fmt(st.times[p])}</div></div>`});
  h+="</section>"+fastHTML()+tahajjudHTML()+trkHTML()+datesHTML()+"</div>";

function tick(){
  if(!st)return;
  const n=new Date(),now=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
  const T=ORDER.map(p=>secs(st.times[p]));
  let idx=T.findIndex(x=>x>now),nextT,prevT,wrap=false;
  if(idx<0){idx=0;wrap=true;nextT=T[0]+86400;prevT=T[5]}
  else{nextT=T[idx];prevT=idx===0?T[5]-86400:T[idx-1]}
  const d=Math.max(0,nextT-now);
  const p=prefs();
  const offset=p.offset*60;
  const hi=ORDER.findIndex((name,i)=>now>=T[i]-offset&&now-T[i]+offset<3);
  if(rem&&hi>=0&&fired!==dk(n)+hi){
    fired=dk(n)+hi;
    const nm2=ORDER[hi];
    toast(p.offset?'Prayer reminder: '+nm2+' in '+p.offset+' minutes':'It’s time for '+nm2);
    if(p.adhan)chime();
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Prayo',{body:(p.offset?nm2+' begins in '+p.offset+' minutes':'It’s time for '+nm2)+' · '+st.label})}catch(e){}
  }
  const f=x=>String(x).padStart(2,"0");
  document.getElementById("cd").textContent=`${f(Math.floor(d/3600))}:${f(Math.floor(d%3600/60))}:${f(d%60)}`;
  const name=ORDER[idx];
  document.getElementById("nm").textContent=name;
  document.getElementById("ar").textContent=AR[name];
  const pr=Math.min(1,Math.max(0,(now-prevT)/(nextT-prevT)));
  document.getElementById("prog").style.strokeDashoffset=C*(1-pr);
  ORDER.forEach((p,i)=>{const r=document.getElementById("r-"+p);if(!r)return;
    r.className="row"+(i===idx?" on":(wrap||i<idx?" past":""))});
}

function dateForZone(zone){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:zone,day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());
  const get=type=>parts.find(part=>part.type===type).value;
  return `${get('day')}-${get('month')}-${get('year')}`;
}
async function load(url,label,coords){
  document.getElementById("out").innerHTML='<div class="glass sk">Loading…</div>';
  try{
    const r=await fetch(url);if(!r.ok)throw new Error("Prayer-times service request failed");
    const d=await r.json();
    if(d.code!==200||!d.data||!d.data.timings)throw new Error("Prayer-times service returned invalid data");
    const tz=d.data.meta&&d.data.meta.timezone?d.data.meta.timezone:"";
    const hj=d.data.date.hijri;
    const sub=`${d.data.date.readable} · ${hj.day} ${hj.month.en} ${hj.year} AH`;
    const mt=d.data.meta||{},meta={lat:+mt.latitude||coords.latitude,lon:+mt.longitude||coords.longitude,hday:hj.day};
    render(d.data.timings,label||tz,sub,false,meta);
    const p=prefs();ls('prayo:lastTimes',{times:st.times,label:st.label,sub:st.sub,meta:st.meta,day:dk(new Date()),method:p.method,asr:p.asr,manual:p.manual});
    return true;
  }catch(e){
    const saved=ls('prayo:lastTimes'),p=prefs();
    if(saved&&saved.times&&saved.label===label&&saved.day===dk(new Date())&&saved.method===p.method&&saved.asr===p.asr&&saved.manual===p.manual){render(saved.times,saved.label,saved.sub,false,saved.meta);toast('Showing saved times for this location');return true}
    document.getElementById("out").innerHTML='<div class="glass sk">Prayer times could not be loaded. Check your connection and try again.</div>';
    return false
  }
}
function placeLabel(place){return [place.name,place.admin1,place.country].filter((value,index,array)=>value&&array.indexOf(value)===index).join(', ')}
function hidePlaces(){const list=$('places');list.hidden=true;list.replaceChildren()}
function showPlaces(places){
  const list=$('places');list.replaceChildren();
  if(!places.length){const empty=document.createElement('div');empty.className='place-option';empty.textContent='No matching cities found. Check the city and country.';list.append(empty);list.hidden=false;return}
  places.forEach(place=>{
    const button=document.createElement('button');button.type='button';button.className='place-option';button.setAttribute('role','option');
    button.textContent=place.name;
    const detail=document.createElement('small');detail.textContent=[place.admin1,place.country].filter(Boolean).join(', ');button.append(detail);
    button.addEventListener('click',()=>choosePlace(place));list.append(button);
  });
  list.hidden=false;
}
async function searchPlaces(){
  const city=$('city').value.trim(),country=$('country').value.trim(),request=++placeRequest;
  selectedPlace=null;
  if(city.length<2){hidePlaces();return}
  const list=$('places');list.replaceChildren();const loading=document.createElement('div');loading.className='place-option';loading.textContent='Searching cities…';list.append(loading);list.hidden=false;
  try{
    const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=100&language=en&format=json`);
    if(!response.ok)throw new Error('City search service request failed');
    const data=await response.json();
    if(request!==placeRequest)return;
    let places=(data.results||[]).filter(place=>!country||(place.country||'').toLowerCase().includes(country.toLowerCase()));
    places.sort((a,b)=>Number(b.name.toLowerCase()===city.toLowerCase())-Number(a.name.toLowerCase()===city.toLowerCase()));
    showPlaces(places);
  }catch(e){if(request===placeRequest){hidePlaces();toast('Couldn’t search for cities. Check your connection and try again.')}}
}
async function choosePlace(place){
  selectedPlace=place;$('city').value=place.name;$('country').value=place.country||'';
  hidePlaces();
  const p=prefs(),label=placeLabel(place),date=dateForZone(place.timezone||'UTC');
  const url=`https://api.aladhan.com/v1/timings/${date}?latitude=${encodeURIComponent(place.latitude)}&longitude=${encodeURIComponent(place.longitude)}&method=${p.method}&school=${p.asr}`;
  if(!await load(url,label,{latitude:place.latitude,longitude:place.longitude}))toast('Couldn’t load prayer times for this location. Please try again.');
}
async function byCity(){
  const city=$('city').value.trim(),country=$('country').value.trim();
  if(!city||!country){toast('Please enter a city and country');return}
  if(selectedPlace&&selectedPlace.name===city&&selectedPlace.country===country){await choosePlace(selectedPlace);return}
  await searchPlaces();
}
async function initCity(){
  const city=$('city').value.trim(),country=$('country').value.trim();
  try{
    const response=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=100&language=en&format=json`);
    if(!response.ok)throw new Error('City search service request failed');
    const data=await response.json(),place=(data.results||[]).find(result=>result.name.toLowerCase()===city.toLowerCase()&&result.country.toLowerCase()===country.toLowerCase());
    if(place)await choosePlace(place);else await searchPlaces();
  }catch(e){document.getElementById('out').innerHTML='<div class="glass sk">Search for a city to see local prayer times.</div>'}
}
function byGeo(){
  if(!navigator.geolocation){toast("Location isn’t supported on this device");return}
  toast("Finding your location…");
  navigator.geolocation.getCurrentPosition(async pos=>{
    const{latitude:la,longitude:lo}=pos.coords;
    let label="Your location";
    const p=prefs();
    let zone=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
    try{
      const response=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=en`);
      if(response.ok){
        const g=await response.json();
        if(g.city||g.locality)label=`${g.city||g.locality}${g.countryName?", "+g.countryName:""}`;
        if(g.timezone&&g.timezone.name)zone=g.timezone.name;
      }
    }catch(e){}
    const date=dateForZone(zone);
    const ok=await load(`https://api.aladhan.com/v1/timings/${date}?latitude=${la}&longitude=${lo}&method=${p.method}&school=${p.asr}`,label,{latitude:la,longitude:lo});
    if(!ok)toast('Couldn’t load prayer times for your location. Please try again.');
  },()=>{toast("Couldn’t get your location. Allow access, or search by city.")},{timeout:10000});
}
$('city').addEventListener('input',()=>{selectedPlace=null;placeRequest++;clearTimeout(placeTimer);placeTimer=setTimeout(searchPlaces,300)});
$('country').addEventListener('input',()=>{selectedPlace=null;placeRequest++;clearTimeout(placeTimer);placeTimer=setTimeout(searchPlaces,300)});
[$('city'),$('country')].forEach(input=>input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();byCity()}}));
document.addEventListener('keydown',event=>{if(event.key==='Escape')hidePlaces()});
initCity();
</script>
</body>
</html>
